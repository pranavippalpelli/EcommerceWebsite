{% extends "./base.html" %}

{% block title %} {{product.product_name}} {% endblock title %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-md-1"></div>
       
        <div class="col-md-4">
            <img src="{{ product.image }}" width="300" height="300" alt="{{ product.product_name }}">
        </div>
      
        <div class="col-md-6">
            <div class="row">
                <h1>{{product.product_name}}</h1>
                <h5>{{product.desc}}</h5>
                <h4>Rs. {{product.price}}</h4><br>
                <a href="/" class="mt-3 btn btn-success">Back</a>
        </div>
      
        <div class="col-md-1"></div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

<script>
    let cart = localStorage.getItem('cart') ? JSON.parse(localStorage.getItem('cart')) : {};
    console.log(cart);
    
    let sum = 0;

    if ($.isEmptyObject(cart)) {
        $('#items').append('<p><h5>Your Cart is Empty.....</h5></p>');
    } else {
        for (let item in cart) {
            let name = cart[item][1];
            let qty = cart[item][0];
            sum += qty;
            $('#items').append('<li class="list-group-item d-flex justify-content-between align-items-center">' + name + '<span>' + qty + '</span></li>');
        }
    }

    document.getElementById('cart').innerHTML = sum;
    $('#itemsjson').val(JSON.stringify(cart));

    {% if thank %}
        alert('Thank you for your order. Your order ID is {{id}}. Use it to track your order.');
        localStorage.clear();
        document.location = "/";
    {% endif %}
</script>
{% endblock content %}
